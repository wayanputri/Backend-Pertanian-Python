version: "3.9"

services:
  run-ui:
    build: .
    container_name: run-ui
    command: python app_http.py
    ports:
      - "5002:5002"
    volumes:
      - .:/app
    restart: unless-stopped

  run-grpc:
    build: .
    container_name: run-grpc
    command: python grpc_server.py
    ports:
      - "50052:50052"
    volumes:
      - .:/app
    restart: unless-stopped
